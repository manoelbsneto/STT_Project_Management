  configuration:
    settings:
      GenerativeActionsEnabled: true

  template: kickStartTemplate-1.0.0

components:
  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: PedirDecisao
    parentBotId: df148bf8-0a3e-495b-80c4-841dcb61d9a4
    description: Coleta solicitacao de decisao e confirma antes de qualquer gravacao.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.PedirDecisao
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: PedirDecisao
          includeInOnSelectIntent: false
          triggerQueries:
            - preciso de uma decisao
            - preciso de uma decisao
            - solicitar aprovacao
            - solicitar aprovacao
            - decisao para projeto
            - decisao para projeto

        actions:
          - kind: Question
            id: ask_decision_project
            variable: Topic.ProjectName
            prompt: Qual projeto precisa de decisao?
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_decision_desc
            variable: Topic.Descricao
            prompt: Descreva a decisao necessaria.
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_decision_impact
            variable: Topic.Impacto
            prompt: Qual e o impacto? Baixo, Medio, Alto ou Critico.
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_decision_due
            variable: Topic.Prazo
            prompt: Qual e o prazo da decisao?
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_decision_approver
            variable: Topic.Aprovador
            prompt: Quem e o aprovador?
            entity: StringPrebuiltEntity

          - kind: Question
            id: confirm_decision
            variable: Topic.Confirmar
            prompt: "Solicitacao: {Topic.Descricao} | Impacto: {Topic.Impacto} | Prazo: {Topic.Prazo} | Projeto: {Topic.ProjectName} | Aprovador: {Topic.Aprovador}. Confirma?"
            entity: BooleanPrebuiltEntity

          - kind: ConditionGroup
            id: confirm_decision_branch
            conditions:
              - id: decision_confirmed
                condition: =Topic.Confirmar = true
                actions:
                  - kind: SendActivity
                    id: decision_confirmed_msg
                    activity: Confirmacao recebida. A gravacao deve criar item em Decisoes do Board; o fluxo PMO_PA_RegistrarDecisaoBoard sera disparado pelo SharePoint.

            elseActions:
              - kind: SendActivity
                id: decision_cancelled_msg
                activity: Ok, nao registrei a solicitacao de decisao.

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: AtualizarTarefa
    parentBotId: df148bf8-0a3e-495b-80c4-841dcb61d9a4
    description: Coleta dados de atualizacao de tarefa, confirma antes de acionar o fluxo AtualizarTarefa com recalculo de percentual inline.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.AtualizarTarefa
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: AtualizarTarefa
          includeInOnSelectIntent: false
          triggerQueries:
            - atualizar tarefa
            - concluir tarefa
            - mudar status tarefa
            - tarefa concluida
            - completar tarefa

        actions:
          - kind: Question
            id: ask_taskid
            variable: Topic.TaskID
            prompt: Qual o ID da tarefa que deseja atualizar? (numero)
            entity: NumberPrebuiltEntity

          - kind: Question
            id: ask_status
            variable: Topic.Status
            prompt: "Qual o novo status? Escolha: Pendente, Em Andamento, Concluida ou Cancelada."
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_horas_realizadas
            variable: Topic.HorasRealizadas
            prompt: Quantas horas realizadas? (responda 0 para pular)
            entity: NumberPrebuiltEntity

          - kind: Question
            id: ask_responsavel
            variable: Topic.Responsavel
            prompt: Novo responsavel? (responda "nao" para manter o atual)
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_datafim
            variable: Topic.DataFim
            prompt: Novo prazo? (responda "nao" para manter o atual)
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_prioridade
            variable: Topic.Prioridade
            prompt: "Nova prioridade? Escolha: Baixa, Media, Alta, Critica ou responda \"nao\" para manter."
            entity: StringPrebuiltEntity

          - kind: Question
            id: confirm_atualizar
            variable: Topic.Confirmar
            prompt: |-
              Vou atualizar a tarefa #{Topic.TaskID}:
              Status: {Topic.Status}
              Horas realizadas: {Topic.HorasRealizadas}
              Responsavel: {Topic.Responsavel}
              Prazo: {Topic.DataFim}
              Prioridade: {Topic.Prioridade}

              Confirma?
            entity: BooleanPrebuiltEntity

          - kind: ConditionGroup
            id: confirm_branch
            conditions:
              - id: confirmed
                condition: =Topic.Confirmar = true
                actions:
                  - kind: SetVariable
                    id: set_global_taskid
                    variable: Global.PMO_Atualizar_TaskID
                    value: =Topic.TaskID

                  - kind: SetVariable
                    id: set_global_status
                    variable: Global.PMO_Atualizar_Status
                    value: =Topic.Status

                  - kind: SetVariable
                    id: set_global_horas_realizadas
                    variable: Global.PMO_Atualizar_HorasRealizadas
                    value: =Topic.HorasRealizadas

                  - kind: SetVariable
                    id: set_global_responsavel
                    variable: Global.PMO_Atualizar_Responsavel
                    value: =Topic.Responsavel

                  - kind: SetVariable
                    id: set_global_datafim
                    variable: Global.PMO_Atualizar_DataFim
                    value: =Topic.DataFim

                  - kind: SetVariable
                    id: set_global_prioridade
                    variable: Global.PMO_Atualizar_Prioridade
                    value: =Topic.Prioridade

                  - kind: BeginDialog
                    id: call_atualizar_tarefa
                    input: {}
                    dialog: template-content.action.PMO_PA_AtualizarTarefa
                    output:
                      binding:
                        result: Topic.message

                  - kind: SendActivity
                    id: atualizar_done
                    activity: |-
                      Tarefa #{Topic.TaskID} atualizada.

                      Status: {Topic.Status}
                      Horas: {Topic.HorasRealizadas}
                      Responsavel: {Topic.Responsavel}
                      Prazo: {Topic.DataFim}
                      Prioridade: {Topic.Prioridade}

                      {Topic.message}

            elseActions:
              - kind: SendActivity
                id: atualizar_cancelled
                activity: Ok, atualizacao cancelada. Se quiser tentar novamente, diga "atualizar tarefa".

