    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.Fallback
    dialog:
      beginDialog:
        kind: OnUnknownIntent
        id: main
        actions:
          - kind: ConditionGroup
            id: conditionGroup_LktzXw
            conditions:
              - id: conditionItem_tlGIVo
                condition: =System.FallbackCount < 3
                actions:
                  - kind: SendActivity
                    id: sendMessage_QZreqo
                    activity: Não sei como ajudar. Você pode tentar reformular a pergunta?

            elseActions:
              - kind: BeginDialog
                id: 5aXj5M
                dialog: template-content.topic.Escalonar

