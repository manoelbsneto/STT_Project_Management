kind: BotDefinition
entity:
  accessControlPolicy: Any
  authenticationMode: Integrated
  authenticationTrigger: Always
  configuration:
    settings:
      GenerativeActionsEnabled: true

  template: kickStartTemplate-1.0.0

components:
  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: AtualizarStatus
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Coleta status RAG e confirma antes de acionar o fluxo on-demand.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.AtualizarStatus
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: AtualizarStatus
          includeInOnSelectIntent: false
          triggerQueries:
            - atualizar projeto
            - status do projeto
            - status de projeto
            - update projeto
            - atualizar status

        actions:
          - kind: Question
            id: ask_project
            variable: Topic.ProjectName
            prompt: Qual projeto você quer atualizar?
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_rag
            variable: Topic.StatusRAG
            prompt: Qual é o novo status RAG? Responda Verde, Amarelo ou Vermelho.
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_resumo
            variable: Topic.Resumo
            prompt: Qual é o resumo do status?
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_risco
            variable: Topic.Risco
            prompt: Há algum risco relevante? Se não houver, responda não.
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_next
            variable: Topic.ProximaAcao
            prompt: Qual é a próxima ação? Se não houver, responda não.
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_percent
            variable: Topic.Percentual
            prompt: Qual é o percentual concluído? Responda de 0 a 100.
            entity: NumberPrebuiltEntity

          - kind: Question
            id: confirm_update
            variable: Topic.Confirmar
            prompt: "Vou registrar: {Topic.ProjectName} como {Topic.StatusRAG}, resumo: {Topic.Resumo}. Confirma?"
            entity: BooleanPrebuiltEntity

          - kind: ConditionGroup
            id: confirm_update_branch
            conditions:
              - id: confirmed
                condition: =Topic.Confirmar = true
                actions:
                  - kind: BeginDialog
                    id: call_checkin_ondemand
                    dialog: template-content.action.PMO_PA_CheckInOnDemand

                  - kind: SendActivity
                    id: update_done
                    activity: Status do {Topic.ProjectName} atualizado para {Topic.StatusRAG}.

            elseActions:
              - kind: SendActivity
                id: update_denied
                activity: Ok, vamos refazer. Qual projeto?

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: Greeting
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Menu inicial do Assistente PMO.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.Greeting
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: Greeting
          includeInOnSelectIntent: false
          triggerQueries:
            - ola
            - olá
            - oi
            - bom dia
            - help
            - ajuda

        actions:
          - kind: SendActivity
            id: greeting_menu
            activity: |-
              Olá, eu sou o Assistente PMO.

              Posso ajudar com:
              - atualizar status de projeto
              - consultar portfólio
              - consultar detalhes de projeto
              - registrar risco ou bloqueio
              - solicitar decisão do board

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: PMO_PA_CheckInOnDemand
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Acao vinculada ao fluxo Power Automate PMO_PA_CheckInOnDemand.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.action.PMO_PA_CheckInOnDemand
    dialog:
      kind: TaskDialog
      outputs:
        - propertyName: success

        - propertyName: message

        - propertyName: errorcode

      action:
        kind: InvokeFlowTaskAction
        flowId: f5aab85e-ff46-f111-bec7-7ced8d955c6c
        connectionProperties:
          $kind: ConnectionProperties
          diagnostics:
          mode: Invoker

      outputMode: All

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: PMO_PA_ListarTarefas
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Acao vinculada ao fluxo Power Automate PMO_PA_ListarTarefas — lista tarefas de um projeto.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.action.PMO_PA_ListarTarefas
    dialog:
      kind: TaskDialog
      inputs:
        - kind: ManualTaskInput
          propertyName: text
          value: =Global.PMO_Listar_ProjectID

      outputs:
        - propertyName: result
          name: Resultado
          description: Lista formatada de tarefas retornada pelo fluxo PMO_PA_ListarTarefas.

      action:
        kind: InvokeFlowTaskAction
        flowId: 9544f14b-3748-f111-bec7-6045bdf42cae
        connectionProperties:
          $kind: ConnectionProperties
          diagnostics:
          mode: Invoker

      outputMode: All

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: ConsultarProjeto
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Consulta guiada de detalhes de um projeto.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.ConsultarProjeto
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: ConsultarProjeto
          includeInOnSelectIntent: false
          triggerQueries:
            - como está o projeto
            - como esta o projeto
            - status de projeto
            - detalhes projeto
            - consultar projeto

        actions:
          - kind: Question
            id: ask_project_detail
            variable: Topic.ProjectName
            prompt: Qual projeto você quer consultar?
            entity: StringPrebuiltEntity

          - kind: SendActivity
            id: project_stub
            activity: |-
              Projeto: {Topic.ProjectName}
              Status: consultar Projetos.StatusRAG.
              Progresso: consultar Projetos.Percentual.
              Alvo: consultar Projetos.DataAlvo.
              PM: consultar Projetos.PM.
              Último update: consultar Status Diario mais recente por ProjectID.
              Riscos abertos: consultar Riscos e Bloqueios por ProjectID e Status aberto.

  - kind: DialogComponent
    managedProperties:
      isCustomizable: false

    displayName: PMO_PA_EscalarRiscoCritico
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.action.PMO_PA_EscalarRiscoCritico
    dialog:
      kind: TaskDialog
      outputs:
        - propertyName: success

        - propertyName: message

        - propertyName: errorcode

      action:
        kind: InvokeFlowTaskAction
        flowId: e5381002-0547-f111-bec7-000d3abc5cc6
        connectionProperties:
          $kind: ConnectionProperties
          diagnostics:
          mode: Invoker

      outputMode: All

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: LowConfidence
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Fallback quando a intenção não for reconhecida.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.LowConfidence
    dialog:
      beginDialog:
        kind: OnUnknownIntent
        id: main
        actions:
          - kind: SendActivity
            id: low_confidence_msg
            activity: "Não entendi bem. Você pode reformular? Posso ajudar com: criar tarefa/projeto, atualizar tarefa, atualizar status, consultar portfólio, consultar projeto, listar tarefas, registrar risco, registrar bloqueio, solicitar decisão."

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: PMO_PA_CriarTarefa
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Acao vinculada ao fluxo Power Automate PMO_PA_CriarTarefa.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.action.PMO_PA_CriarTarefa
    dialog:
      kind: TaskDialog
      inputs:
        - kind: ManualTaskInput
          propertyName: nomeProjeto
          value: =Global.PMO_Criar_Title

        - kind: ManualTaskInput
          propertyName: titulo
          value: =Global.PMO_Criar_Title

        - kind: ManualTaskInput
          propertyName: responsavel
          value: =Global.PMO_Criar_Responsavel

        - kind: ManualTaskInput
          propertyName: prazo
          value: =Global.PMO_Criar_DataFim

        - kind: ManualTaskInput
          propertyName: horas
          value: =Global.PMO_Criar_HorasEstimadas

        - kind: ManualTaskInput
          propertyName: prioridade
          value: =Global.PMO_Criar_Prioridade

      outputs:
        - propertyName: result
          name: Resultado
          description: Mensagem retornada pelo fluxo PMO_PA_CriarTarefa com o codigo gerado.

      action:
        kind: InvokeFlowTaskAction
        flowId: 71f62da4-9748-f111-bec7-6045bdf42cae
        connectionProperties:
          $kind: ConnectionProperties
          diagnostics:
          mode: Invoker

      outputMode: All

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: PMO_PA_AtualizarTarefa
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Acao vinculada ao fluxo Power Automate PMO_PA_AtualizarTarefa — atualiza tarefa e recalcula percentual do projeto.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.action.PMO_PA_AtualizarTarefa
    dialog:
      kind: TaskDialog
      inputs:
        - kind: ManualTaskInput
          propertyName: number
          value: =Global.PMO_Atualizar_TaskID

        - kind: ManualTaskInput
          propertyName: text
          value: =Global.PMO_Atualizar_Status

        - kind: ManualTaskInput
          propertyName: number_1
          value: =Global.PMO_Atualizar_HorasRealizadas

        - kind: ManualTaskInput
          propertyName: text_1
          value: =Global.PMO_Atualizar_Responsavel

        - kind: ManualTaskInput
          propertyName: text_2
          value: =Global.PMO_Atualizar_DataFim

        - kind: ManualTaskInput
          propertyName: text_3
          value: =Global.PMO_Atualizar_Prioridade

        - kind: ManualTaskInput
          propertyName: number_2
          value: =Blank()

      outputs:
        - propertyName: result
          name: Resultado
          description: Mensagem retornada pelo fluxo PMO_PA_AtualizarTarefa.

      action:
        kind: InvokeFlowTaskAction
        flowId: 98408d55-3748-f111-bec7-000d3abc5cc6
        connectionProperties:
          $kind: ConnectionProperties
          diagnostics:
          mode: Invoker

      outputMode: All

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: RegistrarBloqueio
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Coleta bloqueio e confirma antes de qualquer gravação.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.RegistrarBloqueio
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: RegistrarBloqueio
          includeInOnSelectIntent: false
          triggerQueries:
            - registrar bloqueio
            - projeto bloqueado
            - bloqueio em projeto
            - novo bloqueio

        actions:
          - kind: Question
            id: ask_block_project
            variable: Topic.ProjectName
            prompt: Qual projeto está bloqueado?
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_block_desc
            variable: Topic.Descricao
            prompt: Descreva o bloqueio.
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_block_impact
            variable: Topic.Impacto
            prompt: Qual é o impacto? Baixo, Médio, Alto ou Crítico.
            entity: StringPrebuiltEntity

          - kind: Question
            id: confirm_block
            variable: Topic.Confirmar
            prompt: "Bloqueio: {Topic.Descricao} | Impacto: {Topic.Impacto} | Projeto: {Topic.ProjectName}. Confirma?"
            entity: BooleanPrebuiltEntity

          - kind: ConditionGroup
            id: confirm_block_branch
            conditions:
              - id: block_confirmed
                condition: =Topic.Confirmar = true
                actions:
                  - kind: SendActivity
                    id: block_confirmed_msg
                    activity: Confirmação recebida. A gravação deve criar item em Riscos e Bloqueios com Tipo=Bloqueio.

            elseActions:
              - kind: SendActivity
                id: block_cancelled_msg
                activity: Ok, não registrei o bloqueio.

  - kind: DialogComponent
    managedProperties:
      isCustomizable: false

    displayName: PMO_PA_RegistrarDecisaoBoard
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.action.PMO_PA_RegistrarDecisaoBoard
    dialog:
      kind: TaskDialog
      outputs:
        - propertyName: success

        - propertyName: message

        - propertyName: errorcode

      action:
        kind: InvokeFlowTaskAction
        flowId: b308fe0b-0547-f111-bec7-7ced8d955c6c
        connectionProperties:
          $kind: ConnectionProperties
          diagnostics:
          mode: Invoker

      outputMode: All

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: RegistrarRisco
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Coleta risco e confirma antes de qualquer gravação.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.RegistrarRisco
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: RegistrarRisco
          includeInOnSelectIntent: false
          triggerQueries:
            - registrar risco
            - novo risco
            - risco no projeto
            - risco em projeto

        actions:
          - kind: Question
            id: ask_risk_project
            variable: Topic.ProjectName
            prompt: Qual projeto tem o risco?
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_risk_desc
            variable: Topic.Descricao
            prompt: Descreva o risco.
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_risk_severity
            variable: Topic.Severidade
            prompt: Qual é a severidade? Baixa, Média, Alta ou Crítica.
            entity: StringPrebuiltEntity

          - kind: Question
            id: confirm_risk
            variable: Topic.Confirmar
            prompt: "Risco: {Topic.Descricao} | Severidade: {Topic.Severidade} | Projeto: {Topic.ProjectName}. Confirma?"
            entity: BooleanPrebuiltEntity

          - kind: ConditionGroup
            id: confirm_risk_branch
            conditions:
              - id: risk_confirmed
                condition: =Topic.Confirmar = true
                actions:
                  - kind: SendActivity
                    id: risk_confirmed_msg
                    activity: Confirmação recebida. A gravação deve criar item em Riscos e Bloqueios com Tipo=Risco; se a severidade for Crítica, o fluxo PMO_PA_EscalarRiscoCritico será disparado pelo SharePoint.

            elseActions:
              - kind: SendActivity
                id: risk_cancelled_msg
                activity: Ok, não registrei o risco.

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: ListarTarefas
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Lista tarefas de um projeto e exibe resultado formatado com Adaptive Card.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.ListarTarefas
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: ListarTarefas
          includeInOnSelectIntent: false
          triggerQueries:
            - listar tarefas
            - tarefas do projeto
            - breakdown do projeto
            - ver tarefas
            - quais tarefas

        actions:
          - kind: Question
            id: ask_projectid
            variable: Topic.ProjectID
            prompt: "Qual o código do projeto? (ex: PRJ-001)"
            entity: StringPrebuiltEntity

          - kind: SetVariable
            id: set_global_projectid
            variable: Global.PMO_Listar_ProjectID
            value: =Topic.ProjectID

          - kind: BeginDialog
            id: call_listar_tarefas
            input: {}
            dialog: template-content.action.PMO_PA_ListarTarefas
            output:
              binding:
                result: Topic.tarefas

          - kind: SendActivity
            id: listar_result
            activity: |-
              Tarefas — {Topic.ProjectID}

              {Topic.tarefas}

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: PedirDecisao
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Coleta solicitação de decisão e confirma antes de qualquer gravação.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.PedirDecisao
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: PedirDecisao
          includeInOnSelectIntent: false
          triggerQueries:
            - preciso de uma decisão
            - preciso de uma decisao
            - solicitar aprovação
            - solicitar aprovacao
            - decisão para projeto
            - decisao para projeto

        actions:
          - kind: Question
            id: ask_decision_project
            variable: Topic.ProjectName
            prompt: Qual projeto precisa de decisão?
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_decision_desc
            variable: Topic.Descricao
            prompt: Descreva a decisão necessária.
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_decision_impact
            variable: Topic.Impacto
            prompt: Qual é o impacto? Baixo, Médio, Alto ou Crítico.
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_decision_due
            variable: Topic.Prazo
            prompt: Qual é o prazo da decisão?
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_decision_approver
            variable: Topic.Aprovador
            prompt: Quem é o aprovador?
            entity: StringPrebuiltEntity

          - kind: Question
            id: confirm_decision
            variable: Topic.Confirmar
            prompt: "Solicitação: {Topic.Descricao} | Impacto: {Topic.Impacto} | Prazo: {Topic.Prazo} | Projeto: {Topic.ProjectName} | Aprovador: {Topic.Aprovador}. Confirma?"
            entity: BooleanPrebuiltEntity

          - kind: ConditionGroup
            id: confirm_decision_branch
            conditions:
              - id: decision_confirmed
                condition: =Topic.Confirmar = true
                actions:
                  - kind: SendActivity
                    id: decision_confirmed_msg
                    activity: Confirmação recebida. A gravação deve criar item em Decisoes do Board; o fluxo PMO_PA_RegistrarDecisaoBoard será disparado pelo SharePoint.

            elseActions:
              - kind: SendActivity
                id: decision_cancelled_msg
                activity: Ok, não registrei a solicitação de decisão.

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: AtualizarTarefa
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Coleta dados de atualizacao de tarefa, confirma antes de acionar o fluxo AtualizarTarefa com recalculo de percentual inline.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.AtualizarTarefa
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: AtualizarTarefa
          includeInOnSelectIntent: false
          triggerQueries:
            - atualizar tarefa
            - concluir tarefa
            - mudar status tarefa
            - tarefa concluída
            - completar tarefa

        actions:
          - kind: Question
            id: ask_taskid
            variable: Topic.TaskID
            prompt: Qual o ID da tarefa que deseja atualizar? (número)
            entity: NumberPrebuiltEntity

          - kind: Question
            id: ask_status
            variable: Topic.Status
            prompt: "Qual o novo status? Escolha: Pendente, Em Andamento, Concluída ou Cancelada."
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_horas_realizadas
            variable: Topic.HorasRealizadas
            prompt: Quantas horas realizadas? (responda 0 para pular)
            entity: NumberPrebuiltEntity

          - kind: Question
            id: ask_responsavel
            variable: Topic.Responsavel
            prompt: Novo responsável? (responda "não" para manter o atual)
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_datafim
            variable: Topic.DataFim
            prompt: Novo prazo? (responda "não" para manter o atual)
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_prioridade
            variable: Topic.Prioridade
            prompt: "Nova prioridade? Escolha: Baixa, Média, Alta, Crítica ou responda \"não\" para manter."
            entity: StringPrebuiltEntity

          - kind: Question
            id: confirm_atualizar
            variable: Topic.Confirmar
            prompt: |-
              Vou atualizar a tarefa #{Topic.TaskID}:
              Status: {Topic.Status}
              Horas realizadas: {Topic.HorasRealizadas}
              Responsável: {Topic.Responsavel}
              Prazo: {Topic.DataFim}
              Prioridade: {Topic.Prioridade}

              Confirma?
            entity: BooleanPrebuiltEntity

          - kind: ConditionGroup
            id: confirm_branch
            conditions:
              - id: confirmed
                condition: =Topic.Confirmar = true
                actions:
                  - kind: SetVariable
                    id: set_global_taskid
                    variable: Global.PMO_Atualizar_TaskID
                    value: =Topic.TaskID

                  - kind: SetVariable
                    id: set_global_status
                    variable: Global.PMO_Atualizar_Status
                    value: =Topic.Status

                  - kind: SetVariable
                    id: set_global_horas_realizadas
                    variable: Global.PMO_Atualizar_HorasRealizadas
                    value: =Topic.HorasRealizadas

                  - kind: SetVariable
                    id: set_global_responsavel
                    variable: Global.PMO_Atualizar_Responsavel
                    value: =Topic.Responsavel

                  - kind: SetVariable
                    id: set_global_datafim
                    variable: Global.PMO_Atualizar_DataFim
                    value: =Topic.DataFim

                  - kind: SetVariable
                    id: set_global_prioridade
                    variable: Global.PMO_Atualizar_Prioridade
                    value: =Topic.Prioridade

                  - kind: BeginDialog
                    id: call_atualizar_tarefa
                    input: {}
                    dialog: template-content.action.PMO_PA_AtualizarTarefa
                    output:
                      binding:
                        result: Topic.message

                  - kind: SendActivity
                    id: atualizar_done
                    activity: |-
                      Tarefa #{Topic.TaskID} atualizada.

                      Status: {Topic.Status}
                      Horas: {Topic.HorasRealizadas}
                      Responsável: {Topic.Responsavel}
                      Prazo: {Topic.DataFim}
                      Prioridade: {Topic.Prioridade}

                      {Topic.message}

            elseActions:
              - kind: SendActivity
                id: atualizar_cancelled
                activity: Ok, atualização cancelada. Se quiser tentar novamente, diga "atualizar tarefa".

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: CriarTarefa
    parentBotId: 0c4a9729-d55d-483c-8ec3-db9369583155
    description: Coleta dados de novo projeto/tarefa, confirma e aciona o fluxo CriarTarefa.
    shareContext: {}
    state: Active
    status: Active
    publisherUniqueName: DefaultPublishercolofertasbrasilpro
    schemaName: template-content.topic.CriarTarefa
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: CriarTarefa
          includeInOnSelectIntent: true
          triggerQueries:
            - criar tarefa
            - nova tarefa
            - adicionar tarefa
            - cadastrar tarefa
            - criar projeto
            - novo projeto
            - abrir projeto
            - registrar projeto
            - "criar tarefa:"
            - abrir tarefa

        actions:
          - kind: Question
            id: ask_title
            variable: Topic.Title
            prompt: Qual o titulo da tarefa?
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_responsavel
            variable: Topic.Responsavel
            prompt: Quem e o responsavel pela tarefa?
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_datafim
            variable: Topic.DataFim
            prompt: "Qual o prazo da tarefa? (formato: dd/mm/aaaa)"
            entity: StringPrebuiltEntity

          - kind: Question
            id: ask_horas
            variable: Topic.HorasEstimadas
            prompt: Quantas horas estimadas para essa tarefa?
            entity: NumberPrebuiltEntity

          - kind: Question
            id: ask_prioridade
            variable: Topic.Prioridade
            prompt: "Qual a prioridade? Escolha: Baixa, Media, Alta ou Critica."
            entity: StringPrebuiltEntity

          - kind: Question
            id: confirm_criar
            variable: Topic.Confirmar
            prompt: |-
              Vou criar a tarefa '{Topic.Title}'.
              Responsavel: {Topic.Responsavel}
              Prazo: {Topic.DataFim}
              Horas: {Topic.HorasEstimadas}h
              Prioridade: {Topic.Prioridade}
              O codigo do projeto sera gerado automaticamente.

              Confirma?
            entity: BooleanPrebuiltEntity

          - kind: ConditionGroup
            id: confirm_branch
            conditions:
              - id: confirmed
                condition: =Topic.Confirmar = true
                actions:
                  - kind: SetVariable
                    id: set_global_title
                    variable: Global.PMO_Criar_Title
                    value: =Topic.Title

                  - kind: SetVariable
                    id: set_global_responsavel
                    variable: Global.PMO_Criar_Responsavel
                    value: =Topic.Responsavel

                  - kind: SetVariable
                    id: set_global_datafim
                    variable: Global.PMO_Criar_DataFim
                    value: =Topic.DataFim

                  - kind: SetVariable
                    id: set_global_horas
                    variable: Global.PMO_Criar_HorasEstimadas
                    value: =Topic.HorasEstimadas

                  - kind: SetVariable
                    id: set_global_prioridade
                    variable: Global.PMO_Criar_Prioridade
                    value: =Topic.Prioridade

                  - kind: BeginDialog
                    id: call_criar_tarefa
                    input: {}
                    dialog: template-content.action.PMO_PA_CriarTarefa
                    output:
                      binding:
                        result: Topic.message

                  - kind: SendActivity
                    id: criar_done
                    activity: "{Topic.message}"

            elseActions:
              - kind: SendActivity
                id: criar_cancelled
                activity: Ok, criacao cancelada. Se quiser tentar novamente, diga "criar tarefa".

