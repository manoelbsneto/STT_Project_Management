name: Validate Secrets

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for exposed secrets in .env
        run: |
          if grep -E "^[A-Z_]+=(ghp_|sk-|AIza)" .env 2>/dev/null; then
            echo "❌ ERROR: Exposed secret found in .env file!"
            exit 1
          fi
          echo "✅ No exposed secrets found in .env"

      - name: Validate devcontainer.json secrets reference
        run: |
          if ! grep -q "GITHUB_TOKEN" .devcontainer/devcontainer.json; then
            echo "❌ ERROR: GITHUB_TOKEN not referenced in devcontainer.json"
            exit 1
          fi
          echo "✅ GITHUB_TOKEN properly referenced in devcontainer.json"

      - name: Verify .env is in .gitignore
        run: |
          if ! grep -q "^\.env$" .gitignore; then
            echo "❌ ERROR: .env is not in .gitignore!"
            exit 1
          fi
          echo "✅ .env is properly ignored"
