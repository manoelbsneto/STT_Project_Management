          - kind: SendActivity
            id: low_confidence_msg
            activity: "Nao entendi bem. Voce pode reformular? Posso ajudar com: criar tarefa/projeto, atualizar tarefa, atualizar status, consultar portfolio, consultar projeto, listar tarefas, registrar risco, registrar bloqueio, solicitar decisao."

  - kind: DialogComponent
    managedProperties:
      isCustomizable: true

    displayName: AtualizarStatus
    description: Coleta status RAG e confirma antes de acionar o fluxo on-demand.
    shareContext: {}
    state: Active
    status: Active
    schemaName: template-content.topic.AtualizarStatus
    dialog:
      beginDialog:
        kind: OnRecognizedIntent
        id: main
        intent:
          displayName: AtualizarStatus
          includeInOnSelectIntent: false
          triggerQueries:
            - atualizar projeto
            - status do projeto
            - status de projeto
            - update projeto
            - atualizar status
        actions:
          - kind: SetVariable
            id: set_status_raw_input
            variable: Topic.RawInput
            value: =System.Activity.Text

          - kind: SetVariable
            id: parse_status_project
            variable: Topic.ProjectName
            value: =If(IsMatch(Topic.RawInput, "projeto\s*[:=]\s*(?<v>[^,\r\n]+)", MatchOptions.IgnoreCase), Trim(Match(Topic.RawInput, "projeto\s*[:=]\s*(?<v>[^,\r\n]+)", MatchOptions.IgnoreCase).v), Blank())

          - kind: SetVariable
            id: parse_status_rag
            variable: Topic.StatusRAG
            value: =If(IsMatch(Topic.RawInput, "(verde|amarelo|vermelho)", MatchOptions.IgnoreCase), Lower(Match(Topic.RawInput, "(verde|amarelo|vermelho)", MatchOptions.IgnoreCase).FullMatch), Blank())

          - kind: SetVariable
            id: parse_status_resumo
            variable: Topic.Resumo
            value: =If(IsMatch(Topic.RawInput, "resumo\s*[:=]\s*(?<v>[^,\r\n]+)", MatchOptions.IgnoreCase), Trim(Match(Topic.RawInput, "resumo\s*[:=]\s*(?<v>[^,\r\n]+)", MatchOptions.IgnoreCase).v), Blank())

          - kind: SetVariable
            id: parse_status_risco
            variable: Topic.Risco
            value: =If(IsMatch(Topic.RawInput, "risco\s*[:=]\s*(?<v>[^,\r\n]+)", MatchOptions.IgnoreCase), Trim(Match(Topic.RawInput, "risco\s*[:=]\s*(?<v>[^,\r\n]+)", MatchOptions.IgnoreCase).v), Blank())

          - kind: SetVariable
            id: parse_status_next
            variable: Topic.ProximaAcao
            value: =If(IsMatch(Topic.RawInput, "(proxima acao|acao)\s*[:=]\s*(?<v>[^,\r\n]+)", MatchOptions.IgnoreCase), Trim(Match(Topic.RawInput, "(proxima acao|acao)\s*[:=]\s*(?<v>[^,\r\n]+)", MatchOptions.IgnoreCase).v), Blank())

          - kind: SetVariable
            id: parse_status_percent
            variable: Topic.Percentual
            value: =If(IsMatch(Topic.RawInput, "(percentual|progresso)\s*[:=]\s*(?<v>\d+(?:[.,]\d+)?)", MatchOptions.IgnoreCase), Value(Substitute(Match(Topic.RawInput, "(percentual|progresso)\s*[:=]\s*(?<v>\d+(?:[.,]\d+)?)", MatchOptions.IgnoreCase).v, ",", ".")), Blank())

          - kind: ConditionGroup
            id: ask_missing_status_project
            conditions:
              - id: missing_status_project
                condition: =IsBlank(Topic.ProjectName)
                actions:
                  - kind: Question
                    id: ask_project
                    variable: Topic.ProjectName
                    prompt: "Qual projeto voce quer atualizar?"
                    entity: StringPrebuiltEntity

          - kind: ConditionGroup
            id: ask_missing_status_rag
            conditions:
              - id: missing_status_rag
                condition: =IsBlank(Topic.StatusRAG)
                actions:
                  - kind: Question
                    id: ask_rag
                    variable: Topic.StatusRAG
                    prompt: "Qual e o novo status RAG? Responda Verde, Amarelo ou Vermelho."
                    entity: StringPrebuiltEntity

          - kind: ConditionGroup
            id: ask_missing_status_resumo
            conditions:
              - id: missing_status_resumo
                condition: =IsBlank(Topic.Resumo)
                actions:
                  - kind: Question
                    id: ask_resumo
                    variable: Topic.Resumo
                    prompt: "Qual e o resumo do status?"
                    entity: StringPrebuiltEntity

          - kind: ConditionGroup
            id: ask_missing_status_risco
            conditions:
              - id: missing_status_risco
                condition: =IsBlank(Topic.Risco)
                actions:
                  - kind: Question
                    id: ask_risco
                    variable: Topic.Risco
                    prompt: "Ha algum risco relevante? Se nao houver, responda nao."
                    entity: StringPrebuiltEntity

          - kind: ConditionGroup
            id: ask_missing_status_next
            conditions:
              - id: missing_status_next
                condition: =IsBlank(Topic.ProximaAcao)
                actions:
                  - kind: Question
                    id: ask_next
                    variable: Topic.ProximaAcao
                    prompt: "Qual e a proxima acao? Se nao houver, responda nao."
                    entity: StringPrebuiltEntity

          - kind: ConditionGroup
            id: ask_missing_status_percent
            conditions:
              - id: missing_status_percent
                condition: =IsBlank(Topic.Percentual)
                actions:
                  - kind: Question
                    id: ask_percent
                    variable: Topic.Percentual
                    prompt: "Qual e o percentual concluido? Responda de 0 a 100."
                    entity: NumberPrebuiltEntity

          - kind: Question
            id: confirm_update
            variable: Topic.Confirmar
            prompt: "Vou registrar: {Topic.ProjectName} como {Topic.StatusRAG}, resumo: {Topic.Resumo}. Confirma?"
            entity: StringPrebuiltEntity

          - kind: ConditionGroup
            id: confirm_update_branch
            conditions:
              - id: confirmed
                condition: =Or(Lower(Topic.Confirmar) = "sim", Lower(Topic.Confirmar) = "s", Lower(Topic.Confirmar) = "yes", Lower(Topic.Confirmar) = "confirmo")
                actions:
                  - kind: SetVariable
                    id: set_status_project_global
                    variable: Global.PMO_Status_ProjectName
                    value: =Topic.ProjectName

                  - kind: BeginDialog
                    id: call_checkin_ondemand
                    dialog: template-content.action.PMO_PA_CheckInOnDemand

                  - kind: SendActivity
                    id: update_done
                    activity: "Status do {Topic.ProjectName} enviado para processamento. RAG: {Topic.StatusRAG}. Percentual: {Topic.Percentual}."
            elseActions:
              - kind: SendActivity
                id: update_denied
                activity: "Ok, vamos refazer. Qual projeto?"

