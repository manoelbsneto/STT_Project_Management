kind: AdaptiveDialog
startBehavior: UseLatestPublishedContentAndCancelOtherTopics
beginDialog:
  kind: OnError
  id: main
  actions:
    - kind: SendActivity
      id: error_msg
      activity: "Ocorreu um erro no Assistente PMO. Codigo: {System.Error.Code}."


# ConversationStart_Warmup.yaml
# Purpose:
#   Conversation-start topic for Assistente PMO V2. Microsoft documents this
#   system topic as the place where the agent can greet the user before the user
#   enters input. This file keeps only that supported behavior.
#
# Deploy in Copilot Studio:
#   1. Open Assistente PMO V2 > Topics > System > Conversation start.
#   2. Open Code editor and replace the topic YAML with this file's content.
#   3. Save, publish, then start a new test conversation.
#   4. Keep Fallback_SmartRedirect.yaml deployed as the supported fallback
#      safety net for unrecognized first commands.
#
# Notes:
#   - This topic does not claim to force-load NLU. That behavior is not exposed
#     as a documented Copilot Studio YAML/API operation.
#   - It does not call business flows and does not start PMO operations.
#   - Teams channel caveat: Microsoft documents that Conversation Start can run
#     only once when the user first adds the agent to Teams.
#   - If importing through an unpacked solution, keep the botcomponent.xml wrapper
#     generated by Copilot Studio and replace only the AdaptiveDialog data body.

kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: conversation_start_message
      activity: "Ola. Sou o Assistente PMO. Envie seu comando de PMO quando quiser."

inputType: {}
outputType: {}
