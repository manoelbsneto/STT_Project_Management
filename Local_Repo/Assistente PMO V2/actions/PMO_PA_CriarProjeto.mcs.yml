mcs.metadata:
  componentName: PMO_PA_CriarProjeto
  description: Acao vinculada ao fluxo Power Automate PMO_PA_CriarProjeto - cria projeto na lista Projetos.
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: text
    value: =Global.PMO_Projeto_NomeProjeto

  - kind: ManualTaskInput
    propertyName: text_1
    value: =Global.PMO_Projeto_NomeProjeto

  - kind: ManualTaskInput
    propertyName: text_2
    value: =Global.PMO_Projeto_PM

  - kind: ManualTaskInput
    propertyName: text_3
    value: =Global.PMO_Projeto_Prazo

  - kind: ManualTaskInput
    propertyName: number
    value: =0

  - kind: ManualTaskInput
    propertyName: text_4
    value: =Global.PMO_Projeto_Prioridade

modelDescription: Cria projeto na lista SharePoint Projetos.
outputs:
  - propertyName: message
    name: Mensagem
    description: Mensagem retornada pelo fluxo PMO_PA_CriarProjeto.

action:
  kind: InvokeFlowTaskAction
  flowId: 3104124d-364a-f111-bec7-7ced8d955c6c
  connectionProperties:
    $kind: ConnectionProperties
    diagnostics:
    mode: Invoker

outputMode: All